<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>IICT 專題教授地圖</title>
<style>
:root{--bg:#f3f5f7;--surface:#fff;--ink:#16202b;--muted:#5a6775;--line:#d9e0e7;--accent:#0f5c8c;--err:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f151c;--surface:#17202a;--ink:#e6edf3;--muted:#9aa8b6;--line:#2a3644;--accent:#6cb6e6;--err:#f08b83;color-scheme:dark}}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;display:grid;place-items:center;padding:16px;box-sizing:border-box}
form{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--accent);border-radius:12px;padding:24px;width:min(360px,100%);display:grid;gap:12px;box-sizing:border-box}
h1{margin:0;font-size:20px}
p{margin:0;color:var(--muted);font-size:14px}
input[type=password]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
label.r{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
button{font:inherit;font-weight:700;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#msg{color:var(--err);font-size:14px;min-height:1.2em}
</style></head><body>
<form id="f">
<h1>專題教授地圖</h1>
<p>這個頁面有密碼保護，請輸入密碼。</p>
<input type="password" id="pw" autocomplete="current-password" aria-label="密碼" autofocus>
<label class="r"><input type="checkbox" id="rem" checked> 在這台裝置記住我</label>
<button id="go">解鎖</button>
<div id="msg" role="alert"></div>
</form>

const K="iict-map-key-LbW0mT2Z";
const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
(async()=>{try{const raw=localStorage.getItem(K);if(raw){const key=await crypto.subtle.importKey("raw",u(raw),"AES-GCM",true,["decrypt"]);await open(key);}}catch(e){try{localStorage.removeItem(K)}catch(_){}}})();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const btn=document.getElementById("go"),msg=document.getElementById("msg");
  btn.disabled=true;btn.textContent="解鎖中…";msg.textContent="";
  try{const key=await derive(document.getElementById("pw").value);
    const raw=new Uint8Array(await crypto.subtle.exportKey("raw",key));
    await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c));
    if(document.getElementById("rem").checked){try{localStorage.setItem(K,btoa(String.fromCharCode(...raw)))}catch(_){}}
    await open(key);
  }catch(err){msg.textContent="密碼不對，再試一次。";btn.disabled=false;btn.textContent="解鎖";}
});
